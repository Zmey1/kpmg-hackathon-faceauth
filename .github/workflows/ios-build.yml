name: iOS Build (Unsigned)

on:
  push:
    branches: [main, master, final_v1]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --clean

      - name: Set iOS deployment target
        run: |
          # Update Podfile.properties.json with correct deployment target
          cat > ios/Podfile.properties.json << 'EOF'
          {
            "expo.jsEngine": "hermes",
            "newArchEnabled": "true",
            "ios.deploymentTarget": "16.0"
          }
          EOF

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Build unsigned .app
        run: |
          cd ios
          xcodebuild \
            -workspace FaceAuthLite.xcworkspace \
            -scheme FaceAuthLite \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/FaceAuthLite.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/FaceAuthLite.xcarchive/Products/Applications/FaceAuthLite.app build/Payload/
          cd build
          zip -r FaceAuthLite-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FaceAuthLite-unsigned-ipa
          path: build/FaceAuthLite-unsigned.ipa
